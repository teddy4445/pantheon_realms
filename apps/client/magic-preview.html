<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantheon Realms · Painted Magic</title><style>
*{box-sizing:border-box}body{margin:0;background:#101721;color:#f3ddac;font:16px Georgia,serif}header,main{max-width:1180px;margin:auto;padding:20px}header{padding-bottom:8px}h1{margin:8px 0;font-size:30px;letter-spacing:.04em}p{color:#c8b891;line-height:1.5}small{color:#ac9c7c}button,select{font:inherit;color:#f3ddac;background:linear-gradient(#26374c,#142233);border:1px solid #8b7045;border-radius:3px;padding:9px 13px;cursor:pointer}button:hover,button[aria-pressed="true"]{border-color:#f3cf79;background:#344359}button:focus-visible,select:focus-visible{outline:2px solid #ffe3a3;outline-offset:3px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}#spell{flex:1;min-width:230px}#stage{width:100%;border:1px solid #927647;background:#26302c;overflow:hidden;border-radius:4px}canvas{display:block;width:100%;height:auto}#now{display:flex;gap:15px;align-items:center;min-height:106px}#current-icon{width:90px;height:90px;object-fit:contain}h2{margin:5px 0;font-size:24px}#description{margin:0;font-size:15px}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}.card{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px;min-height:160px}.card img{width:88px;height:88px;object-fit:contain}.card span{line-height:1.2;font-size:15px}.card small{font-size:12px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}details{border-top:1px solid #594a32;padding:14px 0;margin-bottom:10px}summary{cursor:pointer;color:#e0bf79}#sheet{width:100%;display:block;background:#202b31;margin-top:12px;border-radius:4px}#status{font-size:13px;color:#cbb88c;min-width:90px}a{color:#e9c37a}@media(max-width:600px){header,main{padding:12px}h1{font-size:24px}.card{min-height:140px}#current-icon{width:66px;height:66px}}
</style></head><body><header><small>PANTHEON REALMS · ART GALLERY</small><h1>Spells &amp; miracles</h1><p>54 painted icons · 432 animation poses · distinct attacks with material particles</p></header><main>
