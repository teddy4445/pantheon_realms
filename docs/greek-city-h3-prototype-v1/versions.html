<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greek Polis — all building versions</title>
<style>
body{margin:24px;background:#18222d;color:#f4e8cc;font:14px system-ui}h1{font:28px Georgia}h2{font:20px Georgia;margin-top:30px}.versions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#28333e;border:1px solid #756446;padding:10px;border-radius:6px}.art{height:190px;background:repeating-conic-gradient(#5b6370 0% 25%,#737a85 0% 50%) 50% / 20px 20px;display:flex;align-items:end;justify-content:center}.art img{max-width:100%;max-height:100%;object-fit:contain}.name{margin-top:10px}.id{font:11px monospace;color:#b6c1ca;margin-top:5px;overflow-wrap:anywhere}a{color:#ead9a9}@media(max-width:750px){.versions{grid-template-columns:repeat(2,1fr)}}
</style><h1>Greek Polis · all 33 building versions</h1><p>Upgrade chains in catalog order. Each asset has its own transparent PNG. <a href="preview.html">Open city preview</a></p><main id="groups"></main>
<script src="manifest.js"></script><script>
for(const b of CITY_MANIFEST.buildings){
 const section=document.createElement('section');section.id=b.id;
 const h=document.createElement('h2');h.textContent=b.name;
 const grid=document.createElement('div');grid.className='versions';
 for(const v of b.variants){
  const card=document.createElement('div');card.className='card';
  const art=document.createElement('a');art.href=v.file;art.className='art';
  const img=document.createElement('img');img.src=v.file;img.alt=v.name;img.dataset.buildingId=v.id;img.dataset.slotId=b.id;art.append(img);
  const name=document.createElement('div');name.className='name';name.textContent=`Level ${v.level} — ${v.name}`;
  const id=document.createElement('div');id.className='id';id.textContent=v.artAssetId;
  card.append(art,name,id);grid.append(card);
 }
 section.append(h,grid);document.querySelector('#groups').append(section);
}
</script></html>
